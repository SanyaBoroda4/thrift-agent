# Shared defaults. Per-machine overrides go in config/settings.local.yaml (git-ignored).
# The Mac's local file sets machine_role: prod and points paths.inbox at iCloud Drive.

machine_role: dev          # dev | prod — only prod may publish

paths:
  inbox: ./var/inbox       # one folder per share from the iPhone
  work: ./var/work         # normalized photos, item folders, contact sheets
  archive: ./var/archive   # finished shares; prod keeps this inside iCloud (Posh/archive, a sibling of inbox)
  failed: ./var/failed     # screenshots + logs for anything that broke
  db: ./var/state.db
  chrome_profile: ./var/chrome-profile
  control: ./var           # PAUSE and HOLD_UNSHIPPED flag files live here
  harvest: ./private/harvest      # raw pages incl. buyer data — never public

models:
  segment: claude-opus-5-5     # splitting the roll is the hardest call: the strongest model (WO17), one call a batch
  extract: claude-sonnet-5
  copy: claude-sonnet-5
  verify: claude-haiku-4-5-20251001
  cover: claude-sonnet-5       # which photo shows the front: one comparison of the item-alone photos (WO23)

images:
  work_long_edge: 2048
  llm_long_edge: 1568
  thumb_long_edge: 768             # segmentation previews (WO17: 384 -> 768: fabric, prints, labels)
  thumb_fallback_long_edge: 384    # ... sent instead when the request would be too large (or the API says 413)
  cover_size: [1200, 1600] # width, height: 3:4 portrait, the frame of Poshmark's cover crop (padded, never cropped)
  cover_check_long_edge: 1024     # the front check's photos: readable, side by side (WO23)
  dedupe_hamming: 4        # consecutive photos closer than this are treated as duplicates

inbox:
  done_marker: _done       # the Shortcut writes this file last
  settle_seconds: 30

segmentation:
  min_confidence: 0.85
  max_request_mb: 20       # the API takes 32 MB per request; above this the previews fall back to the smaller size
  pause_min_seconds: 30    # a break in shooting = a gap > max(pause_min_seconds, pause_factor x the roll's median
  pause_factor: 4          # gap): shown to the model as "— pause 2 min —" and on the contact sheet
  visual_change_min: 0.45  # a colour change between consecutive photos = a distance (0..1) >= max(visual_change_min,
  visual_change_factor: 2.5   # visual_change_factor x the roll's median); with the pauses it flags doubtful splits
  auto_confirm: true       # the owner never confirms the grouping (owner decision, WO20b): it is accepted at once, no
                           # contact sheet; doubts stay in thrift status; [Wrong photos] on a card reopens it. false:
                           # the old flow (contact sheet + ok), for testing
  always_confirm: true     # with auto_confirm false only: the contact sheet for every batch, not just doubtful ones

duplicates:
  lookback_days: 60        # a new item's cover is compared with covers of items from this window
  max_distance: 8          # phash Hamming distance; under this the item is held as a possible re-share

gate:
  # Owner rule: the owner's only routine input is the price, so the gate asks about brand, size or condition
  # only when the model is genuinely unsure. NWT is not confidence-based: it needs hang_tag_photo or a note.
  min_confidence:
    brand: 0.70
    size: 0.70
    condition: 0.70

pricing:
  floor: 20
  default_target: 15       # target sale price when neither the brand nor a category table has one: never no price
  list_markup: 1.35        # most resale sales close via offers — list above the target sale price
  round_to: 5
  condition_multiplier:
    NWT: 1.25
    NWOT: 1.15
    like_new: 1.05
    excellent: 1.00
    good: 0.85
    fair: 0.65
  marketplace_multiplier:
    poshmark: 1.00
    depop: 0.90

copy:
  poshmark_footer: ""        # the closet has never used a footer; add one here if you want it
  depop_footer: ""

poster:
  dry_run: true            # fill + screenshot, never click publish. Flip on the Mac after the dry-run week.
  autopublish_confirmed: false   # the second key: the poster loop publishes only with dry_run false AND this true
                                 # (and marketplaces.<mp>.autopublish true; else a publish-gated item is a draft).
                                 # `thrift poster --publish-first <item>` ignores both: one supervised item.
  dry_run_stage: form      # form = fill, read back, screenshot, leave via Discard | review = also press Next, record
                           # the page after it (failed/shots/<item>-review.json), back out, Discard. Never publishes.
  max_consecutive_failures: 3   # after this many failed items in a row the poster writes PAUSE and stops (stop, don't guess)
  notify_dry_runs: false   # a Telegram photo for every successful dry-run; off: the owner's chat carries the questions
                           # (one at a time, WO20), failures and live listings. The evidence is in failed/shots/ either way.

marketplaces:
  poshmark:
    enabled: true
    username: ""             # set in private/settings.yaml
    autopublish: false     # flip after the dry-run week
    max_photos: 16
  depop:
    enabled: false         # turn on after the Poshmark poster is stable
    username: ""           # set in private/settings.yaml; posters() fails fast when an enabled marketplace has none
    autopublish: false
    max_photos: 8          # verify against the live form

schedule:
  timezone: America/New_York
  hours: ["09:00", "21:00"]
  per_hour_max: 10
  daily_cap: 25
  gap_seconds: [150, 420]

telegram:
  enabled: false
  resend_after_hours: 6    # a batch or item still waiting this long gets its message sent again (Telegram keeps updates 24 h)
  poll_timeout: 15         # getUpdates long-poll seconds; the worker ticks between polls
