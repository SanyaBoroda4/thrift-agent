<!doctype html>
<!-- A stand-in for Depop's create form as the extension's live dry runs recorded it (2026-10-06, WO32): the file input
[data-testid=upload-input__input], each photo then a sortable tile (div[role=button][aria-roledescription=sortable] with
a media-photos.depop.com image; the page shows other Depop images too), the description textarea, Downshift comboboxes
<id>-input / <id>-menu (aria-controls): the category menu lists a name once per department under its heading ("Pants"
under "Men > Bottoms", "Women > Bottoms", "Kids > Bottoms"), the size menu appears after the category, the brand menu is
answered a moment after typing and matches the text as written ("J. Crew" finds only "Other", "J.Crew" finds J.Crew), a
multi-select's choices are chips with button[aria-label="Remove <value>"] (clicking a chosen option unchooses it). Once
the photos are up Depop fills fields by itself (recorded: the colour chips Cream + Grey, the brand J.Crew, the package
Medium; window.__FIXTURE.ai = false turns that off). The price input[data-testid=priceAmount__input][type=number],
Depop Shipping's USPS radio (on by default), the PACKAGE SIZE menu shippingMethods-input, Boost's switch
(label[data-testid=switch-label], "Pay an extra 12% fee"), Post / Save as a draft. Post sends /api/post-click and goes
to /products/<shop>-<words>/ (window.__FIXTURE.land overrides the landing path). -->
<html><head><meta charset="utf-8"><title>Sell an item | Depop</title>
<style>ul{list-style:none;margin:0;padding:0;min-height:2px} [role=option]{padding:2px 4px;cursor:pointer}
.field{margin:6px 0} img{width:40px;height:40px} .later{display:none}</style></head>
<body><main>
<form id="form" aria-label="List an item">
  <h2>Photos</h2>
  <div id="tiles"></div>
  <div data-testid="upload-input"><label for="upload-input__input">Add a photo</label>
    <input id="upload-input__input" aria-label="Add a photo" data-testid="upload-input__input" accept="image/jpeg, image/png" multiple type="file"></div>
  <div class="field"><label for="description">Description</label><textarea id="description" name="description"></textarea></div>
  <div class="field"><div class="ctl"><input id="group-input" role="combobox" aria-controls="group-menu" autocomplete="off"></div><ul id="group-menu" role="listbox"></ul></div>
  <div class="field later" id="size-field"><div class="ctl"><input id="variants-input" role="combobox" aria-controls="variants-menu" autocomplete="off"></div><ul id="variants-menu" role="listbox"></ul></div>
  <div class="field"><div class="ctl"><input id="brand-input" role="combobox" aria-controls="brand-menu" autocomplete="off"></div><ul id="brand-menu" role="listbox"></ul>
    <button type="button" data-testid="brandButton__clear">×</button></div>
  <div class="field"><div class="ctl"><input id="condition-input" role="combobox" aria-controls="condition-menu" autocomplete="off"></div><ul id="condition-menu" role="listbox"></ul></div>
  <div class="field"><div class="ctl"><input id="colour-input" role="combobox" aria-controls="colour-menu" autocomplete="off"></div><ul id="colour-menu" role="listbox"></ul></div>
  <div class="field"><div class="ctl"><input id="source-input" role="combobox" aria-controls="source-menu" autocomplete="off"></div><ul id="source-menu" role="listbox"></ul></div>
  <div class="field"><div class="ctl"><input id="age-input" role="combobox" aria-controls="age-menu" autocomplete="off"></div><ul id="age-menu" role="listbox"></ul></div>
  <div class="field"><div class="ctl"><input id="style-input" role="combobox" aria-controls="style-menu" autocomplete="off"></div><ul id="style-menu" role="listbox"></ul></div>
  <div class="field later" id="material-field"><div class="ctl"><input id="attributes.material-input" role="combobox" aria-controls="attributes.material-menu" autocomplete="off"></div><ul id="attributes.material-menu" role="listbox"></ul></div>
  <div class="field"><label for="priceAmount__input">Price</label><input id="priceAmount__input" type="number" aria-label="Item price" data-testid="priceAmount__input" step="any" min="0" value="0.00"></div>
  <div class="field"><label data-testid="switch-label"><input data-testid="switch" type="checkbox"><span></span><p>Promote your item in search to help it sell faster. Pay an extra 12% fee, only if you sell.</p></label></div>
  <div data-testid="national-shipping-section"><h2>Shipping</h2>
    <input data-testid="usps__shipping__input" id="usps__shipping" type="radio" value="USPS" checked name="shipping"><label for="usps__shipping">Depop Shipping (via USPS)</label>
    <input data-testid="manual__shipping__input" id="manual__shipping" type="radio" value="MANUAL" name="shipping"><label for="manual__shipping">Other</label>
    <div class="field"><label id="shippingMethods-label">Package size</label><div class="ctl"><input id="shippingMethods-input" role="combobox" aria-controls="shippingMethods-menu" aria-labelledby="shippingMethods-label" autocomplete="off"></div><ul id="shippingMethods-menu" role="listbox"></ul></div>
  </div>
  <button type="submit">Post</button>
  <button type="button">Save as a draft</button>
  <label><input type="checkbox" id="post-another"> Post and add another</label>
</form>
<aside id="elsewhere"><img src="https://media-photos.depop.com/b1/9/90/P2.jpg" alt=""><img src="https://media-photos.depop.com/b1/9/91/P2.jpg" alt=""></aside>
</main>
<script>
const F = window.__FIXTURE || {};
const DEPTS = {"Men > Bottoms": ["Sweatpants", "Pants"], "Women > Bottoms": ["Sweatpants", "Pants", "Skirts"],
               "Kids > Bottoms": ["Sweatpants", "Pants"]};
const OPTIONS = {
  "brand-input": ["J.Crew", "J.Crew Factory", "Tory Burch"],
  "condition-input": ["Brand new", "Like new", "Used - Excellent", "Used - Good", "Used - Fair"],
  "colour-input": ["Black", "Grey", "Cream", "Red", "White"],
  "source-input": ["Vintage", "Preloved"],
  "age-input": ["Modern", "90s"],
  "style-input": ["Casual", "Minimalist"],
  "attributes.material-input": ["Cotton", "Wool", "Silk"],
  "shippingMethods-input": ["Extra small", "Small", "Medium", "Large", "Extra large"],
};
const MULTI = ["colour-input", "source-input", "age-input", "style-input", "attributes.material-input"];
const SIZES = {"Women": ["One size", "XS", "S", "M", "L"], "Men": ["S", "M", "L"], "Kids": ["4 years", "6 years"]};
let dept = null, categoryAt = 0;
window.__picked = {};
const chosen = {};          // multi-select id -> [values]
function chips(id) {
  const ctl = document.getElementById(id).parentElement;
  ctl.querySelectorAll(".chip").forEach((c) => c.remove());
  for (const v of chosen[id] || []) {
    const chip = document.createElement("div");
    chip.className = "chip"; chip.tabIndex = -1;
    chip.innerHTML = '<div class="label"></div><button type="button">✕</button>';
    chip.querySelector(".label").textContent = v;
    const b = chip.querySelector("button");
    b.setAttribute("aria-label", "Remove " + v);
    b.addEventListener("click", () => { chosen[id] = chosen[id].filter((x) => x !== v); chips(id); });
    ctl.insertBefore(chip, document.getElementById(id));
  }
}
function toggle(id, v) {
  chosen[id] = chosen[id] || [];
  chosen[id] = chosen[id].includes(v) ? chosen[id].filter((x) => x !== v) : [...chosen[id], v];
  chips(id);
}
function option(text, onPick) {
  const li = document.createElement("li");
  li.setAttribute("role", "option");
  li.textContent = text;
  li.addEventListener("click", () => onPick(text));
  return li;
}
function wire(id) {
  const input = document.getElementById(id);
  const menu = document.getElementById(id.replace(/-input$/, "") + "-menu");
  const render = () => {
    const q = input.value.trim().toLowerCase();
    menu.innerHTML = "";
    if (id === "group-input") {
      for (const [heading, names] of Object.entries(DEPTS)) {
        const hits = names.filter((n) => !q || n.toLowerCase().includes(q));
        if (!hits.length) continue;
        const h = document.createElement("li");
        h.textContent = heading;
        menu.appendChild(h);
        for (const n of hits) menu.appendChild(option(n, (t) => {
          input.value = t; menu.innerHTML = ""; dept = heading.split(" > ")[0]; categoryAt = Date.now();
          window.__picked.category = heading + " > " + t;
          document.getElementById("size-field").classList.remove("later");
          document.getElementById("material-field").classList.remove("later");
        }));
      }
      return;
    }
    const pool = id === "variants-input"
      ? (Date.now() - categoryAt < (F.sizeLag ?? 0) ? ["One size"] : (SIZES[dept] || []))
      : (OPTIONS[id] || []);
    const show = () => {
      menu.innerHTML = "";
      let hits = pool.filter((o) => !q || o.toLowerCase().includes(q));
      if (id === "brand-input") {                          // Depop's server search: the text as written
        hits = pool.filter((o) => o.toLowerCase().startsWith(q));
        if (!hits.length) hits = ["Other"];
      }
      for (const o of hits) {
        menu.appendChild(option(o, (t) => {
          if (MULTI.includes(id)) { toggle(id, t); input.value = t; }
          else { input.value = t; window.__picked[id] = t; }
          menu.innerHTML = "";
        }));
      }
    };
    if (id === "brand-input") setTimeout(show, F.brandDelay ?? 300); else show();
  };
  input.addEventListener("click", render);
  input.addEventListener("input", render);
  input.addEventListener("keydown", (e) => { if (e.key === "Escape") menu.innerHTML = ""; });
}
["group-input", "variants-input", "shippingMethods-input"].concat(Object.keys(OPTIONS)).forEach((id) => {
  if (!document.getElementById(id).dataset.wired) { document.getElementById(id).dataset.wired = "1"; wire(id); }
});
document.querySelector('[data-testid="brandButton__clear"]').addEventListener("click", () => {
  document.getElementById("brand-input").value = "";
  delete window.__picked["brand-input"];
});
document.getElementById("upload-input__input").addEventListener("change", (e) => {
  let n = 0;
  for (const f of e.target.files) {
    const k = ++n;
    setTimeout(() => {
      const tile = document.createElement("div");
      tile.setAttribute("role", "button");
      tile.setAttribute("aria-roledescription", "sortable");
      tile.innerHTML = '<img alt="" draggable="false">';
      tile.querySelector("img").src = "https://media-photos.depop.com/b1/1/" + k + "/P2.jpg";
      document.getElementById("tiles").appendChild(tile);
    }, 50);
  }
  if (F.ai !== false) setTimeout(() => {               // Depop's own suggestions, once the photos are up
    chosen["colour-input"] = ["Cream", "Grey"]; chips("colour-input");
    document.getElementById("brand-input").value = "J.Crew"; window.__picked["brand-input"] = "J.Crew";
    document.getElementById("shippingMethods-input").value = "Medium";
  }, F.aiDelay ?? 100);
});
window.__chosen = chosen;
document.getElementById("form").addEventListener("submit", (e) => {
  e.preventDefault();
  fetch("/api/post-click").catch(() => {});
  const words = document.getElementById("description").value.split("\n")[0].toLowerCase()
    .replace(/[^a-z0-9 ]/g, "").trim().split(/\s+/).join("-");
  setTimeout(() => { location.href = F.land || ("/products/shopname-" + words + "/"); }, 100);
});
</script>
</body></html>
