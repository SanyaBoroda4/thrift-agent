<!doctype html>
<!-- A stand-in for Vinted's upload form as the extension's live dry runs recorded it (2026-10-06, WO32): the hidden file
input [data-testid=add-photos-input].u-hidden with its [data-testid=media-upload-grid] (each photo a tile with its image),
title / description by data-testid, and the item details, each a readonly input opening its panel:
- category [data-testid=catalog-select-dropdown-input] → [data-testid=catalog-select-dropdown-content] →
  ul[data-testid=category-list]: a branch div#catalog-<id>[role=button], a leaf div#catalog-<id>[role=radio], the title
  in .web_ui__Cell__title; the other fields appear only once a category is chosen;
- brand [data-testid=brand-select-dropdown-input] → its search and [role=button] rows;
- size [data-testid=category-size-single-grid-input] → [data-testid=category-size-single-grid-content]: a grid of
  div[role=checkbox][aria-label] ("Suggested", then the full grid);
- condition [data-testid=category-condition-single-list-input] → div#condition-<id>[role=radio] rows (title + body);
- colour [data-testid=color-select-dropdown-input] and material [data-testid=category-material-multi-list-input] →
  [role=checkbox] rows ("Suggested", then the list); the input lists the choices, comma-separated;
- price [data-testid=price-input--input];
- package size: div#package-size-<n>[data-testid=<n>-package-size--cell] with its title span and
  input#package_type_selector_<n>; the chosen cell turns role=presentation; Vinted picks a Recommended one by itself.
Clicking Upload sends /api/upload-click and goes to /items/9876543210-<words> (window.__FIXTURE.land overrides it). -->
<html><head><meta charset="utf-8"><title>Sell an item | Vinted</title>
<style>.u-hidden{display:none} [role=button],[role=radio],[role=checkbox]{padding:2px 4px;cursor:pointer}
img{width:40px;height:40px} .hidden-until-category{display:none}</style></head>
<body><main id="main">
  <h1>Sell an item</h1>
  <div data-testid="media-upload" id="photos">
    <input data-testid="add-photos-input" class="u-hidden" accept="image/jpeg,image/gif,image/png,image/webp" multiple type="file" name="photos">
    <div data-testid="dropzone"><div data-testid="media-upload-grid" id="grid"></div></div>
  </div>
  <input class="web_ui__Input__value" id="title" data-testid="title--input" type="text" name="title">
  <textarea class="web_ui__Input__value" name="description" id="description" data-testid="description--input"></textarea>
  <label for="category">Category</label>
  <input data-testid="catalog-select-dropdown-input" id="category" readonly placeholder="Select a category" name="category">
  <div data-testid="catalog-select-dropdown-content" id="catalog-content"></div>
  <div class="hidden-until-category" id="details">
    <input data-testid="brand-select-dropdown-input" id="brand" name="brand" readonly>
    <div data-testid="brand-select-dropdown-content" id="brand-content"></div>
    <input data-testid="category-size-single-grid-input" id="size" name="size" readonly>
    <div data-testid="category-size-single-grid-content" id="size-content"></div>
    <input data-testid="category-condition-single-list-input" id="condition" name="condition" readonly>
    <div data-testid="category-condition-single-list-content" id="condition-content"></div>
    <input data-testid="color-select-dropdown-input" id="color" name="color" readonly>
    <div data-testid="color-select-dropdown-content" id="color-content"></div>
    <input data-testid="category-material-multi-list-input" id="material" name="material" readonly>
    <div data-testid="category-material-multi-list-content" id="material-content"></div>
    <input class="web_ui__Input__value" id="price" placeholder="$0.00" data-testid="price-input--input" type="text" name="price">
    <div id="package_size"></div>
  </div>
  <button data-testid="upload-form-save-draft-button" type="button">Save draft</button>
  <button data-testid="upload-form-save-button" type="button">Upload</button>
</main>
<script>
const F = window.__FIXTURE || {};
if (F.verify) {
  document.getElementById("main").innerHTML = "<h1>Verify your phone number before you list</h1>";
}
const TREE = {"Women": {"Clothing": {"Skirts": 5523, "Pants & leggings": {"Wide-leg pants": 1071, "Skinny pants": 185}},
                        "Shoes": {"Ballerinas": 2955}},
              "Men": {"Clothing": {"Pants": 1234}}, "Kids": {}, "Home": {}};
const IDS = {"Women": 1904, "Men": 5, "Kids": 1193, "Home": 1918};
const SIZES = [["XS / US 2", 2], ["S / US 4-6", 3], ["M / US 8-10", 4]];
const CONDITIONS = [["New with tags", 6], ["New without tags", 1], ["Very good", 2], ["Good", 3], ["Satisfactory", 4]];
const COLORS = [["Black", 1], ["Gray", 3], ["Cream", 20], ["Red", 7]];
const MATERIALS = [["Cotton", 44], ["Wool", 46], ["Leather", 43]];
const BRANDS = ["J.Crew", "J.Crew Factory", "Tory Burch"];
let seq = 100;
function cell(title, id, role, body) {
  const li = document.createElement("li");
  const d = document.createElement("div");
  d.setAttribute("role", role);
  if (role !== "button") d.setAttribute("aria-checked", "false");
  d.id = id || ("row-" + (seq++));
  d.innerHTML = '<div class="web_ui__Cell__content"><div class="web_ui__Cell__title"></div>' +
                (body ? '<div class="web_ui__Cell__body"></div>' : "") + "</div>";
  d.querySelector(".web_ui__Cell__title").textContent = title;
  if (body) d.querySelector(".web_ui__Cell__body").textContent = body;
  li.appendChild(d);
  return [li, d];
}
function level(node) {
  const box = document.getElementById("catalog-content");
  box.innerHTML = '<input placeholder="Find a category"><ul data-testid="category-list"></ul>';
  const ul = box.querySelector("ul");
  for (const [name, sub] of Object.entries(node)) {
    const leaf = typeof sub === "number";
    const id = leaf ? "catalog-" + sub : (IDS[name] ? "catalog-" + IDS[name] : undefined);
    const [li, d] = cell(name, id, leaf ? "radio" : "button");
    d.addEventListener("click", () => {
      if (leaf) {
        document.getElementById("category").value = name;
        box.innerHTML = "";
        document.getElementById("details").classList.remove("hidden-until-category");
        packages();
      } else {
        level(sub);
      }
    });
    ul.appendChild(li);
  }
}
document.getElementById("category").addEventListener("click", () => level(TREE));
// Package sizes: a cell each; Vinted chooses a Recommended one by itself (Small, then Medium once a size is set).
function packages() {
  const box = document.getElementById("package_size");
  box.innerHTML = "";
  ["Small", "Medium", "Large"].forEach((name, i) => {
    const n = i + 1;
    const c = document.createElement("div");
    c.id = "package-size-" + n; c.setAttribute("data-testid", n + "-package-size--cell"); c.setAttribute("role", "button");
    c.innerHTML = '<div data-testid="' + n + '-package-size--cell--title"><div class="badge"></div><span>' + name +
                  '</span></div><label><input type="radio" id="package_type_selector_' + n + '" aria-labelledby="package-size-' +
                  n + '" name="package_type_selector_' + n + '"></label>';
    c.addEventListener("click", () => choosePackage(n));
    box.appendChild(c);
  });
  choosePackage(1);
}
function choosePackage(n) {
  document.querySelectorAll('[data-testid$="-package-size--cell"]').forEach((c, i) => {
    const on = i + 1 === n;
    c.setAttribute("role", on ? "presentation" : "button");
    c.querySelector("input").checked = on;
  });
}
function panel(name, rows, multi) {
  const input = document.getElementById(name);
  const content = document.getElementById(name + "-content");
  input.addEventListener("click", () => {
    content.innerHTML = "";
    const chosen = input.value ? input.value.split(", ") : [];
    const add = (label, items, kind) => {
      if (label) { const h = document.createElement("div"); h.textContent = label; content.appendChild(h); }
      const ul = document.createElement("ul");
      for (const [t, id] of items) {
        const [li, d] = name === "size"
          ? (() => { const l = document.createElement("li"); const x = document.createElement("div");
                     x.setAttribute("role", "checkbox"); x.setAttribute("aria-label", t);
                     x.setAttribute("data-testid", kind + "-grid-option-" + id); x.innerHTML = "<span></span>";
                     x.querySelector("span").textContent = t; l.appendChild(x); return [l, x]; })()
          : cell(t, name + "-" + id, multi ? "checkbox" : "radio", name === "condition" ? "a description" : null);
        d.setAttribute("aria-checked", chosen.includes(t) ? "true" : "false");
        d.addEventListener("click", () => {
          let now = input.value ? input.value.split(", ") : [];
          if (multi) now = now.includes(t) ? now.filter((x) => x !== t) : [...now, t];
          else now = [t];
          input.value = now.join(", ");
          if (name === "size") choosePackage(2);
          if (!multi) content.innerHTML = "";
        });
        ul.appendChild(li);
      }
      content.appendChild(ul);
    };
    if (name === "size") { add("Suggested", [SIZES[1]], "size-suggestions"); add("Women's items", SIZES, "size-group-4"); }
    else if (multi) { add("Suggested", [rows[2] || rows[0]]); add(null, rows); }
    else add(null, rows);
  });
}
panel("size", SIZES, false);
panel("condition", CONDITIONS, false);
panel("color", COLORS, true);
panel("material", MATERIALS, true);
document.getElementById("brand").addEventListener("click", () => {
  const content = document.getElementById("brand-content");
  content.innerHTML = '<input data-testid="brand-select-dropdown-search-input"><ul></ul>';
  const search = content.querySelector("input");
  search.addEventListener("input", () => {
    const q = search.value.toLowerCase().replace(/[^a-z]/g, "");
    const ul = content.querySelector("ul");
    ul.innerHTML = "";
    BRANDS.filter((b) => b.toLowerCase().replace(/[^a-z]/g, "").includes(q)).forEach((b) => {
      const [li, d] = cell(b, undefined, "button");
      d.addEventListener("click", () => { document.getElementById("brand").value = b; content.innerHTML = ""; });
      ul.appendChild(li);
    });
  });
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") document.querySelectorAll('[id$="-content"]').forEach((c) => { c.innerHTML = ""; });
});
document.querySelector('[data-testid="add-photos-input"]').addEventListener("change", (e) => {
  let k = 0;
  for (const f of e.target.files) {
    const n = k++;
    setTimeout(() => {
      const tile = document.createElement("div");
      tile.setAttribute("data-testid", "image-wrapper-" + n);
      const img = document.createElement("img");
      img.alt = f.name;
      try { img.src = URL.createObjectURL(f); } catch (err) { /* jsdom */ }
      tile.appendChild(img);
      document.getElementById("grid").appendChild(tile);
    }, 50);
  }
});
const upload = document.querySelector('[data-testid="upload-form-save-button"]');
if (upload) upload.addEventListener("click", () => {
  fetch("/api/upload-click").catch(() => {});
  const words = document.getElementById("title").value.toLowerCase().replace(/[^a-z0-9 ]/g, "").trim()
    .split(/\s+/).join("-");
  setTimeout(() => { location.href = F.land || ("/items/9876543210-" + words); }, 100);
});
</script>
</body></html>
