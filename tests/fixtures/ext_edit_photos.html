<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit listing (test fixture)</title>
<!--
  A stand-in for Depop's /products/edit/<slug>/ and Vinted's /items/<id>/edit (WO37), for tests/js/content.test.mjs:
  the photo grid as the read-only probe of 2026-10-12 recorded it — one [role=button][aria-roledescription=sortable]
  per photo with its img (Depop: inside a form, a "Cover" overlay on the first, Save changes = the form's submit;
  Vinted: inside [data-testid=media-upload-grid], a "Main" badge on the first, Save [data-testid=upload-form-save-button]
  disabled until something changes). The sortable answers the keyboard as dnd-kit's KeyboardSensor does: Space (code
  "Space") on a focused photo picks it up, ArrowLeft / ArrowUp (on the window) move it one place / one row, Space drops it
  there. jsdom has no layout: each photo's box comes from its place in a grid of `cols` columns.
  window.__FIXTURE: site ("depop" | "vinted"), photos (default 6), cols (4), ignoreKeys (the grid doesn't move),
  stuck (a move stops one place short).
  window.__saves counts the presses on Save; window.__order() is the photos' order.
-->
</head>
<body>
<main id="main"></main>
<script>
(function () {
  const F = window.__FIXTURE || {};
  const site = F.site || "depop";
  const n = F.photos || 6, cols = F.cols || 4;
  const main = document.getElementById("main");
  window.__saves = 0;
  const src = (i) => site === "depop"
    ? `https://media-photos.depop.com/b1/44365321/49360${i}_aaaa${i}/P2.jpg`
    : `https://images1.vinted.net/tc/0${i}_00e33_PHOTO${i}xxxxxxxxxx/f800/1791854236.webp?s=${i}`;
  let grid, save;
  if (site === "depop") {
    main.innerHTML = `<h1>Editing</h1><form aria-label="List an item"><h2>Photos</h2><div id="grid"></div>
      <textarea id="description">Brown suede ankle boots.</textarea><input id="group-input" value="Boots">
      <button type="submit" hidden aria-hidden="true" tabindex="-1"></button>
      <button type="submit" id="save">Save changes</button><button type="button">Cancel</button></form>`;
    main.querySelector("form").addEventListener("submit", (e) => { e.preventDefault(); window.__saves++; });
  } else {
    main.innerHTML = `<input data-testid="title--input" value="UGG slippers">
      <div data-testid="media-upload-grid" id="grid"></div>
      <button type="button" data-testid="upload-form-save-button" id="save" disabled>Save</button>`;
    main.querySelector("#save").addEventListener("click", () => { window.__saves++; });
  }
  grid = document.getElementById("grid");
  save = document.getElementById("save");
  for (let i = 0; i < n; i++) {
    const box = document.createElement("div");
    box.className = "photo-box";
    box.innerHTML = `<div role="button" tabindex="0" aria-roledescription="sortable"><img alt="Uploaded photo ${i + 1} of ${n}" src="${src(i)}"></div>`;
    grid.appendChild(box);
  }
  const tiles = () => [...grid.querySelectorAll("[aria-roledescription='sortable']")];
  const place = (el) => tiles().indexOf(el);
  Element.prototype.getBoundingClientRect = function () {
    const t = this.closest && this.closest("[aria-roledescription='sortable']");
    const i = t ? place(t) : -1;
    if (i < 0) return { left: 0, top: 0, width: 0, height: 0, right: 0, bottom: 0 };
    const left = (i % cols) * 110, top = Math.floor(i / cols) * 110;
    return { left, top, width: 100, height: 100, right: left + 100, bottom: top + 100 };
  };
  window.__order = () => tiles().map((t) => t.querySelector("img").getAttribute("src"));
  let active = null, target = 0;
  const badge = () => {
    grid.querySelectorAll(".badge").forEach((b) => b.remove());
    const b = document.createElement("div");
    b.className = "badge";
    b.textContent = site === "depop" ? "Cover" : "Main";
    tiles()[0].appendChild(b);
  };
  badge();
  grid.addEventListener("keydown", (e) => {
    if (F.ignoreKeys || e.code !== "Space" || active) return;
    const t = e.target.closest("[aria-roledescription='sortable']");
    if (!t) return;
    e.preventDefault();
    active = t;
    target = place(t);
    setTimeout(() => window.addEventListener("keydown", moving), 0);   // dnd-kit's window listener, after the start
  });
  function moving(e) {
    if (!active) return;
    if (e.code === "ArrowLeft" && target % cols > 0) target -= 1;
    else if (e.code === "ArrowUp" && target >= cols) target -= cols;
    else if (e.code === "Space") {
      window.removeEventListener("keydown", moving);
      const to = F.stuck ? Math.min(target + 1, tiles().length - 1) : target;
      const from = place(active);
      const box = active.parentElement;
      grid.removeChild(box);
      grid.insertBefore(box, grid.children[to] || null);
      if (from !== to && site === "vinted") save.disabled = false;
      active = null;
      badge();
    }
  }
})();
</script>
</body>
</html>
