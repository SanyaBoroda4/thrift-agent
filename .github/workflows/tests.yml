name: tests
on:
  push:
  pull_request:
jobs:
  test:
    # dev is Windows, prod is macOS: run the suite on both, plus Linux.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check thrift_agent tests --select F,E
      - run: pytest -q
