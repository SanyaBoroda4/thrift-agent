name: tests
on:
  push:
  pull_request:
jobs:
  test:
    # dev is Windows, prod is macOS: run the suite on both, plus Linux.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      # WO32: the extension's content scripts are tested in jsdom (Node), the extension itself in Playwright's own
      # Chromium (branded Chrome ignores --load-extension); without them those tests skip.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci --prefix tests/js
      - run: python -m playwright install --with-deps chromium
      - run: ruff check thrift_agent tests --select F,E
      - run: pytest -q
      # The suite must not depend on the machine: run it again as if on the Mac before .env is filled in
      # (prod local config, private settings, empty-token .env, secrets exported in the shell).
      - name: pytest with a prod-like local config present
        env:
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: "12345"
          ANTHROPIC_API_KEY: "sk-ant-not-a-real-key"
        run: python .github/prodlike_config.py && pytest -q
      # The Mac failed three tests after `set -a; source .env`: every TELEGRAM_* variable exported and a real .env
      # at the repo root. The suite must ignore both.
      - name: pytest with exported dummy secrets and a dummy .env at the repo root
        env:
          TELEGRAM_BOT_TOKEN: "123:dummy-token"
          TELEGRAM_CHAT_ID: "-1001234567890"
          TELEGRAM_ALLOWED_USER_IDS: "111,222"
          TELEGRAM_EXTRA_FUTURE_VAR: "x"
          ANTHROPIC_API_KEY: "sk-ant-dummy"
        run: python .github/dummy_env.py && pytest -q
