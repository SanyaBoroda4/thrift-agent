<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Thrift crosslister — options</title>
  <style>
    body { font: 14px -apple-system, BlinkMacSystemFont, sans-serif; margin: 24px; max-width: 520px; }
    input { width: 100%; padding: 8px; font: 13px ui-monospace, Menlo, monospace; box-sizing: border-box; }
    button { margin-top: 12px; padding: 8px 16px; }
    #status { margin-top: 12px; color: #2a7a2a; }
    p { color: #555; }
    #link { margin-top: 20px; font-size: 13px; }
  </style>
</head>
<body>
  <h2>Thrift crosslister</h2>
  <p>The token from the Mac: <code>cat ~/thrift/var/ext_token</code></p>
  <label for="token">Bridge token</label>
  <input id="token" autocomplete="off" spellcheck="false">
  <button id="save">Save</button>
  <div id="status"></div>
  <p id="link"></p>
  <script src="options.js"></script>
</body>
</html>
