<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thrift — listing window</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 48px 24px;
         background: #f6f6f4; color: #222; }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { margin: 0 0 10px; }
  @media (prefers-color-scheme: dark) { body { background: #1d1d1b; color: #e9e9e6; } }
</style>
</head>
<body>
<main>
  <h1 id="title">Thrift listing window</h1>
  <p>The Mac fills its listings in this window, one tab at a time. Leave it open: behind other windows is fine, but
     don't minimize it.</p>
  <p>You can use your own Chrome as usual — this window is the Thrift Chrome's.</p>
</main>
<script src="idle.js"></script>
</body>
</html>
