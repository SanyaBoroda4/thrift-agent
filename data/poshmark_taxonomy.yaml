# Poshmark's create-listing category tree: the names the form offers, spelled as the form shows them.
#
# verified: true  = the lists are the form's own (https://poshmark.com/create-listing): since WO24 every department,
#                   from the form's catalog read 2026-10-04 (the Women Shoes and Kids lists, read off the live form on
#                   2026-09-29, agree with it).
# verified: false = an UNVERIFIED placeholder (none left): never grounds for a question; the poster asks the owner
#                   (needs_owner) when the form doesn't offer a name.
# A category's value is its subcategory list, or ~ when it has none.
#
# thrift_agent/brain/taxonomy.py puts the model's department/category/subcategory onto these names right after
# extraction; the extraction prompt shows the same lists.

