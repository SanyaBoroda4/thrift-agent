# Poshmark's create-listing category tree: the names the form offers, spelled as the form shows them.
#
# verified: true  = the category list was read off the live form (https://poshmark.com/create-listing, 2026-09-29).
# verified: false = UNVERIFIED placeholder (Men, Home): record it on the Mac. The poster asks the owner (needs_owner)
#                   when the form doesn't offer a name.
# A category's value is its subcategory list, or ~ when the list is not recorded yet.
#
# thrift_agent/brain/taxonomy.py puts the model's department/category/subcategory onto these names right after
# extraction; the extraction prompt shows the same lists.

