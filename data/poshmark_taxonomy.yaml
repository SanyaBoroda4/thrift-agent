# The model's word -> Poshmark's name. Only unambiguous renames; anything else is left for the owner.
# Matching ignores case, punctuation, "and" vs "&" and a plural s/es ("Dress" finds "Dresses").
# The price table looks these up the other way too (Kids "Shirts & Tops" -> its "Tops" price), in this order:
# keep the general word first ("Tops" before "Sweaters").
aliases:
  categories:
    Women:
      Coats: Jackets & Coats
      Jackets: Jackets & Coats
      Pants: Pants & Jumpsuits
      Jumpsuits: Pants & Jumpsuits
      Rompers: Pants & Jumpsuits
      Swimwear: Swim
      Swimsuits: Swim
      Intimates: Intimates & Sleepwear
      Sleepwear: Intimates & Sleepwear
      Lingerie: Intimates & Sleepwear
      Handbags: Bags
      Purses: Bags
      Blouses: Tops
      Shirts: Tops
      T-Shirts: Tops
      Sweatshirts: Tops
      Sweatshirts & Hoodies: Tops
      Hoodies: Tops
      Outerwear: Jackets & Coats
    Kids:
      Tops: Shirts & Tops
      Shirts: Shirts & Tops
      T-Shirts: Shirts & Tops
      Tees: Shirts & Tops
      Blouses: Shirts & Tops
      Sweaters: Shirts & Tops
      Sweatshirts: Shirts & Tops
      Hoodies: Shirts & Tops
      Pants: Bottoms
      Jeans: Bottoms
      Shorts: Bottoms
      Skirts: Bottoms
      Leggings: Bottoms
      Joggers: Bottoms
      Sweatpants: Bottoms
      Coats: Jackets & Coats
      Jackets: Jackets & Coats
      Outerwear: Jackets & Coats
      Sleepwear: Pajamas
      Swimwear: Swim
      Rompers: One Pieces
      Bodysuits: One Pieces
      Onesies: One Pieces
      Sets: Matching Sets
  subcategories:
    Women/Shoes:
      Booties: Ankle Boots & Booties
      Ankle Boots: Ankle Boots & Booties
      Chelsea Boots: Ankle Boots & Booties
      Flats: Flats & Loafers
      Ballet Flats: Flats & Loafers
      Loafers: Flats & Loafers
      Mules: Mules & Clogs
      Clogs: Mules & Clogs
      Slides: Sandals
      Flip Flops: Sandals
      Pumps: Heels
      Rain Boots: Winter & Rain Boots
      Snow Boots: Winter & Rain Boots
      Winter Boots: Winter & Rain Boots
      Combat Boots: Combat & Moto Boots
      Moto Boots: Combat & Moto Boots
      Running Shoes: Athletic Shoes
      Trainers: Athletic Shoes
    Kids/Shoes:
      Rain Boots: Rain & Snow Boots
      Snow Boots: Rain & Snow Boots
